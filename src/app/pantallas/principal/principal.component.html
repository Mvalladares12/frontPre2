<!-- tabla-departamentos.component.html -->
<div class="container">
  <div class="header-actions">
    <h2>Lista de Departamentos</h2>

    <!-- Botón crear - controlado por roles -->
    <button *kaHasRoles="['crear']"
            mat-raised-button
            color="primary"
            class="create-button">
      <mat-icon>add</mat-icon>
      Nuevo Departamento
    </button>
  </div>

  <!-- Filtro de búsqueda (comentado como en tu ejemplo) -->
  <!-- <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Buscar departamento</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. San Salvador" #input>
    <mat-icon matSuffix>search</mat-icon>
    <mat-hint>Buscar por nombre, código o ID</mat-hint>
  </mat-form-field> -->

  <!-- Tabla responsive con scroll horizontal -->
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let element">
          <span class="id-badge">{{element.id}}</span>
        </td>
      </ng-container>

      <!-- Columna Código -->
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
        <td mat-cell *matCellDef="let element">
          <span class="codigo-badge">{{element.codigo}}</span>
        </td>
      </ng-container>

      <!-- Columna Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let element">
          <span class="departamento-nombre">{{element.nombre}}</span>
        </td>
      </ng-container>


      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <div class="acciones-container">
            <button *kaHasRoles="['ver']"
                    mat-icon-button color="primary"
                    (click)="verDetalles(element)"
                    matTooltip="Ver detalles del departamento"
                    matTooltipPosition="above"
                    aria-label="Ver detalles">
              <mat-icon>visibility</mat-icon>
            </button>

            <button *kaHasRoles="['ver']"
                    mat-icon-button color="accent"
                    (click)="verMunicipios(element)"
                    matTooltip="Ver municipios"
                    matTooltipPosition="above"
                    aria-label="Ver municipios"
                    [matBadge]="element.municipios.length"
                    matBadgePosition="above after"
                    matBadgeSize="small"
            >
              <mat-icon>apartment</mat-icon>
            </button>

            <button *kaHasRoles="['editar']"
                    mat-icon-button color="accent"
                    (click)="editarDepartamento(element)"
                    matTooltip="Editar departamento"
                    matTooltipPosition="above"
                    aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>

            <button *kaHasRoles="['eliminar']"
                    mat-icon-button color="warn"
                    (click)="eliminarDepartamento(element)"
                    matTooltip="Eliminar departamento"
                    matTooltipPosition="above"
                    aria-label="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Fila cuando no hay datos -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data-message">
            <mat-icon>info</mat-icon>
            <p>No se encontraron departamentos</p>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Paginador responsive -->
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"
                 [pageSize]="5"
                 [showFirstLastButtons]="true"
                 aria-label="Paginador de departamentos">
  </mat-paginator>
</div>
